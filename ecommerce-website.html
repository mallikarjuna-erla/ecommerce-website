<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Commerce Website</title>
  <link rel="stylesheet" href="ecom.css" />
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">ShopEasy</div>
      <ul class="nav-links">
        <li>Home</li>
        <li>Shop</li>
        <li>About</li>
        <li>Contact</li>
        <li class="cart-icon">🛒 <span id="cart-count">0</span></li>
      </ul>
    </nav>
  </header>


  <section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Your one-stop shop for all your needs</p>
    <button id="shop-now">Shop Now</button>
  </section>
  <section class="products">
    <h2>Featured Products</h2>
    <div class="product-container">
      <div class="product">
        <img src="https://tse2.mm.bing.net/th/id/OIP.odlNdEtM6uG1a8HJYk7HkQHaFj?pid=Api&P=0&h=180">
        <h3>Running Shoes</h3>
        <p>₹1500</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://tse2.mm.bing.net/th/id/OIP.E0HqFb3QUflcVW2tgRROUwHaHa?pid=Api&P=0&h=180">
        <h3>Wireless Headphones</h3>
        <p>₹2200</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://tse4.mm.bing.net/th/id/OIP.JgPY2wyuohoVIevT432I-QHaHa?pid=Api&P=0&h=180">
        <h3>Smart Watch</h3>
        <p>₹3500</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>

      <div class="product">
        <img src="https://tse3.mm.bing.net/th/id/OIP.-AtwxKY70S2aTwoDs2BL4AHaE8?pid=Api&P=0&h=180">
        <h3>Laptop</h3>
        <p>₹55000</p>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    </div>
  </section>

  
  <footer>
    <p>© 2025 ShopEasy | Designed by You 💙</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
